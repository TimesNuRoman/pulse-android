apply plugin: 'com.android.application'

// Load release signing credentials from app/keystore.properties (gitignored).
// If the file is missing, we fall back to the debug keystore so that
// contributors can still run `gradlew assembleRelease` for layout checks
// without producing a publishable artifact. The real release pipeline
// (Play Store / F-Droid) MUST have keystore.properties present.
def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    logger.lifecycle("R93b: loaded keystore.properties (alias=${keystoreProperties['keyAlias']}, storeFile=${keystoreProperties['storeFile']})")
} else {
    logger.info("R93b: app/keystore.properties not found; release builds will use the debug signing config as a fallback. See ../RELEASE.md.")
}

android {
    namespace = "app.pulse.notes"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.pulse.notes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 18
        versionName "0.6.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Real release signing: loaded from app/keystore.properties.
        // NEVER hardcode passwords here. NEVER commit keystore.properties.
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                // v1 (JAR signing) is legacy and not used by Android 9+; disabled.
                // v2 is required for APK Signature Scheme v2 (Android 7+).
                // v3 is opt-in in AGP 8.x; enable explicitly so the APK carries
                // both v2 and v3 signature blocks (R95a, future-proofs key rotation).
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            // Use the real release signing config when keystore.properties is present.
            // Otherwise leave it unset so AGP fails loudly instead of silently
            // producing an unsigned APK that nobody can install.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Unchanged: debug builds remain self-contained for side-loading.
            // No regression for the v0.6.4 debug APK pipeline.
            debuggable true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
