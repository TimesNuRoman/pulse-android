# Project-wide Gradle settings for Pulse Android
# Keep these minimal and explicit; project memory is in AGENTS.md.

# JVM args for the Gradle daemon
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Use AndroidX package structure
android.useAndroidX=true

# Resource shrinker-friendly non-transitive R classes
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Build features
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false

# Disable build cache for cleanliness on CI
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false
